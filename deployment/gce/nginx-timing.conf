# Only fixed numbers and the upstream-generated opaque trace ID. No URL, query,
# client address, authorization headers, body, cookies or user context.
log_format discord_mcp_timing escape=json '{"kind":"discord_proxy_timing","completedEpochSeconds":"$msec","requestTrace":"$sent_http_x_discord_trace","httpStatus":$status,"requestSeconds":"$request_time","upstreamSeconds":"$upstream_response_time"}';
